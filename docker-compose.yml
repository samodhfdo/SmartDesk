services:
  postgres:
    image: postgres:16
    container_name: smartdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartdesk
      POSTGRES_USER: smartdesk_user
      POSTGRES_PASSWORD: change_me_locally
    ports:
      - "5432:5432"
    volumes:
      - smartdesk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdesk_user -d smartdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartdesk_data:
